<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Doodcom Hub account</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101311;color:#f0f4eb;font:18px system-ui}main{max-width:560px;margin:28px;padding:38px;border:1px solid #344131;border-radius:24px}h1{color:#caff29}p{line-height:1.6}a{color:#caff29}</style><main><h1 id="title">Return to Doodcom Hub</h1><p id="message">If you have just confirmed your email, return to Doodcom Hub and sign in with your email and password.</p><p>You can close this browser tab.</p><a href="https://github.com/Doodcom/doodcom-hub-releases/releases/latest">Doodcom Hub downloads</a></main><script>const auth=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);history.replaceState(null,'',location.pathname);if(auth.has('error')||query.has('error')){document.getElementById('title').textContent='Confirmation link unavailable';document.getElementById('message').textContent='This link may have expired or already been used. Try signing in to Doodcom Hub. If it asks you to confirm your email, request a fresh confirmation link.';}else if(auth.has('access_token')){document.getElementById('title').textContent='Email confirmed';document.getElementById('message').textContent='Return to Doodcom Hub and sign in with your email and password.';}</script></html>
